<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Donut Animation</title>
  <style>
    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background-color: #1e1e1e;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
      background-color: black;
    }
    canvas:focus,
    canvas:focus-visible {
      outline: 2px solid #457b9d;
      outline-offset: -2px;
    }
  </style>
</head>
<body>
  <script>
    // Bevy/winit calls canvas.focus() once the app is ready, with no
    // preventScroll option, which makes the browser scroll it (and the
    // parent page embedding this iframe) into view. Force preventScroll
    // on every focus() call in this document so that never happens.
    (function () {
      var originalFocus = HTMLElement.prototype.focus;
      HTMLElement.prototype.focus = function (options) {
        return originalFocus.call(this, Object.assign({}, options, { preventScroll: true }));
      };
    })();
  </script>
  <script type="module">
    import init from './wiggles.js';
    init();
  </script>
</body>
</html>
